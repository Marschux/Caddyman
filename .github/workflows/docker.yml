name: docker

on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marschux/caddyman

# Actions are pinned to a commit: a tag can be moved to other code, a commit cannot.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r docker/requirements.txt
      - run: python -m unittest tests.test_main

  # No image from code whose tests fail.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # arm64 is built under emulation, for a Raspberry Pi and the like.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are named after the tag, branch builds after the short SHA.
      - run: |
          tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          docker buildx build --pull --provenance=false --platform linux/amd64,linux/arm64 \
            -f docker/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$tag" --push .
