name: docker

on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marschux/caddyman

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are named after the tag, branch builds after the short SHA.
      - run: |
          tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          docker build --pull --provenance=false -f docker/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$tag" .
          docker push --all-tags "$IMAGE"
