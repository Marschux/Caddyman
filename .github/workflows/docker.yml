name: docker

on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marschux/caddyman

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 is built under emulation, for a Raspberry Pi and the like.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are named after the tag, branch builds after the short SHA.
      - run: |
          tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          docker buildx build --pull --provenance=false --platform linux/amd64,linux/arm64 \
            -f docker/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$tag" --push .
