services:
  caddyman:
    image: ghcr.io/marschux/caddyman:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: caddyman
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    # Keep it: the way back in if the route to Caddyman breaks
    ports:
      - "5052:5052"
    volumes:
      - data:/data
      # Caddy's files; adjust the left side
      - /opt/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/caddy/sites:/etc/caddy/sites
      # Caddy's logs, for the Logs page
      - /opt/caddy/logs:/var/log/caddy:ro
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5052/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
    driver: local

# Shared with Caddy: docker network create proxy-net
networks:
  proxy-net:
    external: true
