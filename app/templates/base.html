<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Caddyman{% endblock %}</title>
	<link rel="stylesheet" href="/static/app.css">
</head>
<body>
	<header>
		<a class="brand" href="/">Caddyman</a>
		{% if request.state.user %}
		<nav>
			<a href="/">Routes</a>
			<a href="/ca">Root CA</a>
			<a href="/backup">Backup</a>
			<a href="/hosts">Hosts</a>
			<a href="/status">Status</a>
		</nav>
		<form method="post" action="/logout">
			<span>{{ request.state.user }}</span>
			<button type="submit" class="link">Log out</button>
		</form>
		{% endif %}
	</header>
	<main>
		{% if flash %}<p class="flash {{ flash[0] }}" role="status">{{ flash[1] }}</p>{% endif %}
		{% block content %}{% endblock %}
	</main>
	<footer>Caddyman {{ version }}</footer>
	{% block scripts %}{% endblock %}
</body>
</html>
