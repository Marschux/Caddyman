<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Caddyman{% endblock %}</title>
	<link rel="stylesheet" href="/static/app.css">
</head>
<body>
	<header>
		<a class="brand" href="/">
			<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
				<defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
					<stop offset="0" stop-color="#64be79"/><stop offset="1" stop-color="#36ceff"/>
				</linearGradient></defs>
				<rect width="24" height="24" rx="6" fill="url(#brand)"/>
				<path d="M8.5 11V8.8a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="#04222b" stroke-width="1.8" stroke-linecap="round"/>
				<rect x="6.5" y="11" width="11" height="7.5" rx="1.8" fill="#04222b"/>
			</svg>
			Caddyman
		</a>
		{% if request.state.user %}
		{% set path = request.url.path %}
		<nav>
			<a href="/" {{ 'aria-current="page"' if path == "/" or path.startswith("/routes") }}>Routes</a>
			<a href="/ca" {{ 'aria-current="page"' if path.startswith("/ca") }}>Root CA</a>
			<a href="/backup" {{ 'aria-current="page"' if path.startswith("/backup") }}>Backup</a>
			<a href="/hosts" {{ 'aria-current="page"' if path.startswith("/hosts") }}>Hosts</a>
			<a href="/status" {{ 'aria-current="page"' if path.startswith("/status") }}>Status</a>
		</nav>
		<form method="post" action="/logout">
			<span>{{ request.state.user }}</span>
			<button type="submit" class="link">Log out</button>
		</form>
		{% endif %}
	</header>
	<main>
		{% if flash %}<p class="flash {{ flash[0] }}" role="status">{{ flash[1] }}</p>{% endif %}
		{% block content %}{% endblock %}
	</main>
	<footer>Caddyman {{ version }}</footer>
	{% block scripts %}{% endblock %}
</body>
</html>
