{% extends "base.html" %}
{% block title %}Log in - Caddyman{% endblock %}
{% block content %}
<form method="post" action="/login" class="card">
	<h1>Log in</h1>
	{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
	<label for="username">Username</label>
	<input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
	<label for="password">Password</label>
	<input id="password" name="password" type="password" autocomplete="current-password" required>
	<button type="submit">Log in</button>
</form>
<div class="card">
	<h2>Only here for the certificate?</h2>
	<p class="below">The root CA and how to install it are open to everyone.</p>
	<p class="below"><a class="button" href="/trust">Get the root CA</a></p>
</div>
{% endblock %}
