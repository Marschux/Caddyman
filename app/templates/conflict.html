{% if conflict %}
<div class="conflict" role="alert">
	<p><strong>This file was changed while you were editing it.</strong> Nothing has been saved. Saving again overwrites the version on disk.</p>
	<p>On disk now</p>
	<pre>{{ conflict.disk }}</pre>
	<p>Your version</p>
	<pre>{{ conflict.yours }}</pre>
</div>
{% endif %}
